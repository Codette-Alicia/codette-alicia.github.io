<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>W26</title>
  
  <style>
        /* Optional: Dark background to make the glowing sun stand out */
        body {
            background-image: url("milky-way.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* The CSS code for the enlarged corner sun */
        .sun {
            position: fixed;
            bottom: -50px;  
            left: -50px;    
            z-index: -1;    

            width: 200px;
            height: 200px;
            
            background: radial-gradient(circle, #ffea00 20%, #ff9100 100%);
            border-radius: 50%;
            box-shadow: 0 0 30px #ff9100, 0 0 60px #ff5500;
        }


    </style>

  <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>PLANETS BEYOND</h1>
<h2>OUR SOLAR SYSTEM</h2>
  <div class="search">
    <input type="number" id="searchBar" placeholder="DISCOVER"/>
  </div>
  <h3>Type any WHOLE number from 1-3</h>
  <br>

  <script src="main.js"></script>

<div class="sun">
    <div class="o-1">
        <div class="p-1"></div>
    </div>
    <div class="o-2">

    </div>

</div>  

</body>
</html>
